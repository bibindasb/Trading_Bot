services:
  bot:                             # the trading agents and the report page, in one container
    image: tr-automation-bot
    build:
      context: .
      network: host                # build with the host's DNS and routes, so private package mirrors resolve
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false            # paper mode runs without it, but the agents need LLM keys to trade
    environment:
      REPORT_HOST: 0.0.0.0         # inside the container; REPORT_BIND below decides who can reach it
      REPORT_BIND: ${REPORT_BIND:-127.0.0.1}
    ports:
      # Report page. Default: this machine only (http://127.0.0.1:8080, or an SSH tunnel from elsewhere).
      # REPORT_BIND=0.0.0.0 in .env opens it to the network, and then the bot insists on a REPORT_PASSWORD.
      - "${REPORT_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ./config:/app/config:ro    # edit settings.yaml, then: docker compose restart
      - state:/app/state           # risk guard state, paper ledger, checkpoints, KILL switch
      - logs:/app/logs
    # Let a running trade finish placing its order and stop loss before the container is killed.
    stop_grace_period: 2m

volumes:
  state:
  logs:
