exchange: binance                # any ccxt exchange id that has a sandbox
symbols: [BTC/USDT, ETH/USDT]    # also the risk guard's allowlist
timeframe: 15m
run_interval_minutes: 15
live_trading: false              # live also needs LIVE_TRADING=true in .env
paper_trading: true              # when not live: true = simulated fills, false = real orders on the testnet
paper:
  starting_cash: 100             # in the quote currency (USDT)
  fee_pct: 0.001
backtest:
  slippage_pct: 0.0005           # fills this far beyond the candle close (buys above, sells below)

risk:
  max_position_pct: 0.15         # 15% of the account per trade
  max_order_usdt: 15             # fixed cap per trade in USDT; null = only the % limit above
  max_total_exposure_pct: 0.30   # at most two $15 trades open at once
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.10
  max_orders_per_hour: 4
  kill_switch_file: state/KILL   # create this file to stop all trading; delete it to resume

news:
  feeds:                         # RSS 2.0 feeds; headlines are untrusted and only reach the sentiment agent
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
  max_age_hours: 24
  keywords:                      # whole words that tie a headline to a coin
    BTC: [bitcoin, btc]
    ETH: [ethereum, eth, ether]

llm:
  timeout_seconds: 60            # per request
  max_retries: 2                 # per provider, on timeouts, rate limits and server errors
  providers:                     # tried in order; the next one is the fallback
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      model_env:                 # .env variables holding provider/model IDs; unset skips this provider for that tier
        fast: OPENROUTER_FAST_MODEL            # market, sentiment and risk agents
        reasoning: OPENROUTER_REASONING_MODEL  # decision agent
    - name: fastrouter
      base_url: https://api.fastrouter.ai/api/v1
      api_key_env: FASTROUTER_API_KEY
      model_env:
        fast: FASTROUTER_FAST_MODEL
        reasoning: FASTROUTER_REASONING_MODEL
